<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Tool</title>
    <script>
      // Apply the saved theme before first paint (defaults to light).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('review-tool:theme') || 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
